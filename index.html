<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooms</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

#app {
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.screen {
    width: 100%;
    max-width: 900px;
}

.card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 25px;
}

h1,
h2,
h3 {
    margin-top: 0;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    color: #aaa;
    margin-bottom: 6px;
}

.checkboxLabel {
    display: flex !important;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.checkboxLabel input {
    width: auto;
    flex-shrink: 0;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #111;
    color: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #777;
}

button {
    padding: 11px 16px;
    border: 0;
    border-radius: 7px;
    background: #eee;
    color: #111;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

button.green {
    background: #3cab5c;
    color: white;
}

button.red {
    background: #d43b3b;
    color: white;
}

button.dark {
    background: #333;
    color: white;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.row {
    display: flex;
    gap: 10px;
}

.row > * {
    flex: 1;
}

.error {
    color: #ff6666;
    margin-top: 12px;
}

.success {
    color: #65d883;
    margin-top: 12px;
}

.hidden {
    display: none !important;
}

.connBanner {
    background: #3a2a10;
    border: 1px solid #8a5a10;
    color: #ffcf8a;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 15px;
    font-size: 13px;
}

.roomList {
    margin-top: 20px;
}

.roomListHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.roomListHeader span {
    color: #888;
    font-size: 13px;
}

.room {
    background: #222;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.roomInfo {
    flex: 1;
    min-width: 0;
}

.roomName {
    font-weight: bold;
    font-size: 16px;
    word-break: break-word;
}

.roomDetails {
    color: #999;
    font-size: 13px;
    margin-top: 5px;
}

.roomCodeSmall {
    color: #666;
    font-family: monospace;
    margin-top: 4px;
}

.emptyRooms {
    color: #777;
    text-align: center;
    padding: 30px 10px;
    border: 1px dashed #333;
    border-radius: 8px;
}

.roomTop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.roomCode {
    font-family: monospace;
    font-size: 22px;
    letter-spacing: 3px;
}

.roomStatus {
    color: #999;
    font-size: 13px;
}

#roomLayout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 15px;
}

.panel {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    overflow: hidden;
}

.panelHeader {
    padding: 13px;
    border-bottom: 1px solid #333;
    font-weight: bold;
}

#players {
    padding: 8px;
}

.player {
    background: #222;
    border-radius: 6px;
    padding: 9px;
    margin-bottom: 5px;
    word-break: break-word;
}

.player.host {
    border-left: 3px solid #65d883;
}

.playerYou {
    color: #65d883;
    font-size: 11px;
    margin-left: 5px;
}

#chat {
    height: 430px;
    overflow-y: auto;
    padding: 12px;
}

.message {
    margin-bottom: 9px;
    word-break: break-word;
}

.messageName {
    font-weight: bold;
}

.systemMessage {
    color: white;
    font-size: 13px;
}

#chatInputArea {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid #333;
}

#chatInput {
    flex: 1;
}

#chatInputArea button {
    width: 70px;
}

.noMessages {
    color: #666;
    text-align: center;
    margin-top: 40px;
}

.modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modalCard {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 25px;
    width: 100%;
    max-width: 380px;
}

.colorRow {
    display: flex;
    align-items: center;
    gap: 12px;
}

.colorRow input[type="color"] {
    width: 50px;
    height: 42px;
    padding: 3px;
    flex: none;
}

.colorPreview {
    font-weight: bold;
}

@media (max-width: 650px) {
    #roomLayout {
        grid-template-columns: 1fr;
    }

    .room {
        align-items: stretch;
        flex-direction: column;
    }

    .room button {
        width: 100%;
    }

    .row {
        flex-direction: column;
    }

    #chat {
        height: 350px;
    }

    .roomTop {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="homeScreen" class="screen">
        <div class="card">

            <h1>rooms</h1>

            <div id="connBanner" class="connBanner hidden"></div>

            <div class="field">
                <label>account name</label>
                <input id="homeName" maxlength="20" placeholder="your name">
            </div>

            <div class="row">
                <button id="createButton" class="green">
                    create room
                </button>

                <button id="browseButton" class="dark">
                    browse rooms
                </button>
            </div>

            <div id="homeError" class="error"></div>

        </div>
    </div>


    <div id="createScreen" class="screen hidden">

        <div class="card">

            <h2>create room</h2>

            <div class="field">
                <label>room name</label>
                <input id="createRoomName" maxlength="40" placeholder="my room">
            </div>

            <div class="field">
                <label>account name</label>
                <input id="createName" maxlength="20" placeholder="your name">
            </div>

            <div class="field">
                <label>maximum players</label>

                <select id="maxPlayers">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="8">8</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="25">25</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                    <option value="50">50</option>
                </select>
            </div>

            <div class="field">
                <label class="checkboxLabel">
                    <input type="checkbox" id="privateRoom">
                    private room (needs a code, hidden from the browse list)
                </label>
            </div>

            <div class="row">
                <button id="createRoomButton" class="green">
                    create
                </button>

                <button id="backFromCreate" class="dark">
                    back
                </button>
            </div>

            <div id="createError" class="error"></div>

        </div>

    </div>


    <div id="browseScreen" class="screen hidden">

        <div class="card">

            <h2>browse rooms</h2>

            <div class="field">
                <label>room code (optional)</label>

                <input
                    id="roomCodeInput"
                    maxlength="6"
                    placeholder="leave blank to browse"
                    style="text-transform:uppercase"
                >
            </div>

            <div class="field">
                <label>account name</label>
                <input id="browseName" maxlength="20" placeholder="your name">
            </div>

            <div class="row">
                <button id="joinCodeButton" class="green">
                    join code
                </button>

                <button id="backFromBrowse" class="dark">
                    back
                </button>
            </div>

            <div id="browseError" class="error"></div>

            <div class="roomList">

                <div class="roomListHeader">
                    <strong>available rooms</strong>
                    <span id="roomCount">0 rooms</span>
                </div>

                <div id="roomList"></div>

            </div>

        </div>

    </div>


    <div id="roomScreen" class="screen hidden">

        <div class="roomTop">

            <div>
                <div id="displayRoomName">
                    room
                </div>

                <div class="roomStatus">
                    code:
                    <span id="displayRoomCode" class="roomCode">
                        ------
                    </span>
                </div>

                <div id="roomStatus" class="roomStatus">
                    waiting
                </div>
            </div>

            <div class="row">
                <button id="settingsButton" class="dark">
                    settings
                </button>

                <button id="leaveButton" class="red">
                    leave
                </button>
            </div>

        </div>

        <div id="roomError" class="error"></div>

        <div id="roomLayout">

            <div class="panel">

                <div class="panelHeader">
                    players
                    <span id="playerCount">
                        0 / 0
                    </span>
                </div>

                <div id="players"></div>

            </div>


            <div class="panel">

                <div class="panelHeader">
                    chat
                </div>

                <div id="chat"></div>

                <div id="chatInputArea">

                    <input
                        id="chatInput"
                        maxlength="300"
                        placeholder="type a message..."
                    >

                    <button id="sendButton">
                        send
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<div id="settingsModal" class="modalOverlay hidden">

    <div class="modalCard">

        <h3>settings</h3>

        <div class="field">
            <label>chat name color</label>

            <div class="colorRow">
                <input type="color" id="chatColorInput" value="#65d883">
                <span id="colorPreview" class="colorPreview">preview name</span>
            </div>
        </div>

        <div class="row">
            <button id="closeSettings" class="dark">
                close
            </button>
        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    get,
    remove,
    push,
    onValue,
    onDisconnect,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ============================== */
/* FIREBASE CONFIG                */
/* ============================== */

const firebaseConfig = {
apiKey: "AIzaSyDf60lZZGaSdXmrqI9MoLRgV3ulYtD4J5I",
authDomain: "school-chat-d9a65.firebaseapp.com",
databaseURL: "https://school-chat-d9a65-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "school-chat-d9a65",
storageBucket: "school-chat-d9a65.firebasestorage.app",
messagingSenderId: "215900413514",
appId: "1:215900413514:web:d4bfa83bc8bb66a3c310b3",
measurementId: "G-7K9VS92EPC"
};


/* ============================== */
/* FIREBASE                       */
/* ============================== */

const app = initializeApp(firebaseConfig);

console.log(
    "rooms app build: cross-device-fix-v1"
);

const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let authReady = false;

let currentRoom = null;
let currentName = null;
let currentRoomName = null;

let isHost = false;

let roomListener = null;
let playersListener = null;
let messagesListener = null;
let browserListener = null;
let connListener = null;

let disconnectPlayerRef = null;
let disconnectNameRef = null;

let currentColor =
    localStorage.getItem("chatColor") ||
    "#65d883";


/* ============================== */
/* SETTINGS                       */
/* ============================== */

const bannedWords = [
    "fuck",
    "fucker",
    "fucking",
    "shit",
    "bitch",
    "bastard",
    "dick",
    "dickhead",
    "cunt",
    "asshole",
    "nigger",
    "nigga",
    "faggot",
    "fag",
    "retard"
];


/* ============================== */
/* HELPERS                        */
/* ============================== */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.add("hidden");
        });

    document
        .getElementById(id)
        .classList.remove("hidden");
}


function cleanName(name) {

    return name
        .trim()
        .replace(/\s+/g, " ")
        .slice(0, 20);
}


function cleanRoomName(name) {

    return name
        .trim()
        .replace(/\s+/g, " ")
        .slice(0, 40);
}


function normalizeName(name) {

    return name
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
}


function validName(name) {

    if (!name) {
        return false;
    }

    if (name.length < 1 || name.length > 20) {
        return false;
    }

    return /^[a-zA-Z0-9 _-]+$/.test(name);
}


function validRoomName(name) {

    if (!name) {
        return false;
    }

    if (name.length < 1 || name.length > 40) {
        return false;
    }

    return /^[a-zA-Z0-9 _!?.(),'’-]+$/.test(name);
}


function generateRoomCode() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {

        code += characters[
            Math.floor(
                Math.random() * characters.length
            )
        ];
    }

    return code;
}


function censorMessage(message) {

    let result = message;

    for (const word of bannedWords) {

        const escaped = word.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );

        const regex = new RegExp(
            "\\b" + escaped + "\\b",
            "gi"
        );

        result = result.replace(
            regex,
            match => "*".repeat(match.length)
        );
    }

    return result;
}


function countPlayers(players) {

    if (!players) {
        return 0;
    }

    return Object.keys(players).length;
}


function clearErrors() {

    document
        .querySelectorAll(".error")
        .forEach(element => {
            element.textContent = "";
        });
}


function setError(id, text) {

    document.getElementById(id).textContent = text;
}


// Turns a raw Firebase error into something a user (or you, debugging on
// another device) can actually act on instead of just failing silently.
function describeFirebaseError(error) {

    if (!error) {
        return "unknown error.";
    }

    if (error.code === "PERMISSION_DENIED") {
        return "permission denied by the database rules. " +
            "open the Firebase console -> Realtime Database -> Rules, " +
            "and make sure reads/writes are allowed for signed-in users " +
            "(for example \".read\": \"auth != null\", \".write\": \"auth != null\").";
    }

    if (error.code === "auth/unauthorized-domain") {
        return "this domain isn't authorized for sign-in. " +
            "open the Firebase console -> Authentication -> Settings -> " +
            "Authorized domains, and add the domain you're loading this page from.";
    }

    if (error.code === "auth/admin-restricted-operation" ||
        error.code === "auth/operation-not-allowed") {
        return "anonymous sign-in isn't enabled for this project. " +
            "open the Firebase console -> Authentication -> Sign-in method, " +
            "and enable the Anonymous provider.";
    }

    return (error.message || error.code || String(error)) + ".";
}


/* ============================== */
/* CONNECTION STATUS              */
/* ============================== */
// Shows a banner whenever this device loses its live connection to
// Firebase, so "rooms aren't showing up" doesn't fail silently -
// this is what actually differs between devices/networks most often.

function startConnectionWatcher() {

    if (connListener) {
        connListener();
    }

    const connectedRef = ref(db, ".info/connected");

    connListener = onValue(connectedRef, snapshot => {

        const banner = document.getElementById("connBanner");

        if (snapshot.val() === true) {
            banner.classList.add("hidden");
            banner.textContent = "";
        } else {
            banner.classList.remove("hidden");
            banner.textContent =
                "not connected to the server yet - rooms won't appear until this connects. " +
                "check your internet connection.";
        }
    });
}


/* ============================== */
/* AUTH                           */
/* ============================== */

signInAnonymously(auth)
    .catch(error => {
        console.error("sign-in failed:", error);

        setError(
            "homeError",
            "couldn't connect: " + describeFirebaseError(error)
        );
    });


onAuthStateChanged(auth, user => {

    currentUser = user;
    authReady = !!user;

    if (user) {
        clearErrors();
    }
});

startConnectionWatcher();


/* ============================== */
/* HOME                           */
/* ============================== */

document.getElementById("createButton").onclick = () => {

    clearErrors();

    const name = cleanName(
        document.getElementById("homeName").value
    );

    if (!validName(name)) {

        setError(
            "homeError",
            "enter a valid account name."
        );

        return;
    }

    document.getElementById("createName").value =
        name;

    showScreen("createScreen");
};


document.getElementById("browseButton").onclick = () => {

    clearErrors();

    if (!authReady) {

        setError(
            "homeError",
            "still connecting to the server - wait a second and try again."
        );

        return;
    }

    const name = cleanName(
        document.getElementById("homeName").value
    );

    document.getElementById("browseName").value =
        name;

    showScreen("browseScreen");

    startRoomBrowser();
};


/* ============================== */
/* BACK                           */
/* ============================== */

document.getElementById("backFromCreate").onclick = () => {

    clearErrors();

    showScreen("homeScreen");
};


document.getElementById("backFromBrowse").onclick = () => {

    clearErrors();

    stopRoomBrowser();

    showScreen("homeScreen");
};


/* ============================== */
/* ROOM BROWSER                   */
/* ============================== */

function startRoomBrowser() {

    stopRoomBrowser();

    const roomsRef = ref(db, "rooms");

    browserListener = onValue(
        roomsRef,
        snapshot => {

            const roomList =
                document.getElementById("roomList");

            roomList.innerHTML = "";

            if (!snapshot.exists()) {

                document.getElementById(
                    "roomCount"
                ).textContent = "0 rooms";

                roomList.innerHTML = `
                    <div class="emptyRooms">
                        no available rooms
                    </div>
                `;

                return;
            }

            const rooms = snapshot.val();

            Object.entries(rooms)
                .forEach(([code, room]) => {

                    if (
                        room &&
                        countPlayers(room.players) === 0
                    ) {

                        remove(
                            ref(
                                db,
                                "rooms/" + code
                            )
                        ).catch(error => {

                            console.error(
                                "empty room cleanup failed:",
                                error
                            );
                        });
                    }
                });

            const availableRooms = Object.entries(
                rooms
            )
            .filter(([code, room]) => {

                if (!room) {
                    return false;
                }

                if (room.private) {
                    return false;
                }

                if (countPlayers(room.players) === 0) {
                    return false;
                }

                const playerCount =
                    countPlayers(room.players);

                if (playerCount >= room.maxPlayers) {
                    return false;
                }

                return true;
            });

            document.getElementById(
                "roomCount"
            ).textContent =
                `${availableRooms.length} ${
                    availableRooms.length === 1
                        ? "room"
                        : "rooms"
                }`;

            if (availableRooms.length === 0) {

                roomList.innerHTML = `
                    <div class="emptyRooms">
                        no available rooms
                    </div>
                `;

                return;
            }

            availableRooms
                .sort((a, b) => {

                    const aTime =
                        a[1].createdAt || 0;

                    const bTime =
                        b[1].createdAt || 0;

                    return bTime - aTime;
                })
                .forEach(([code, room]) => {

                    const playerCount =
                        countPlayers(room.players);

                    const roomElement =
                        document.createElement("div");

                    roomElement.className = "room";

                    const info =
                        document.createElement("div");

                    info.className = "roomInfo";

                    const name =
                        document.createElement("div");

                    name.className = "roomName";

                    name.textContent =
                        room.name || "unnamed room";

                    const details =
                        document.createElement("div");

                    details.className =
                        "roomDetails";

                    details.textContent =
                        `${playerCount} / ${room.maxPlayers} players`;

                    const codeElement =
                        document.createElement("div");

                    codeElement.className =
                        "roomCodeSmall";

                    codeElement.textContent =
                        code;

                    info.appendChild(name);
                    info.appendChild(details);
                    info.appendChild(codeElement);

                    const joinButton =
                        document.createElement("button");

                    joinButton.className = "green";

                    joinButton.textContent = "join";

                    joinButton.onclick = () => {

                        const playerName =
                            cleanName(
                                document
                                    .getElementById(
                                        "browseName"
                                    )
                                    .value
                            );

                        if (!validName(playerName)) {

                            setError(
                                "browseError",
                                "enter a valid account name."
                            );

                            return;
                        }

                        joinRoom(
                            code,
                            playerName
                        );
                    };

                    roomElement.appendChild(info);
                    roomElement.appendChild(joinButton);

                    roomList.appendChild(roomElement);
                });
        },
        error => {

            // This is the important part for the "rooms don't appear"
            // symptom: previously a permission/network error here just
            // failed silently and the list stayed empty forever. Now it
            // tells you exactly why.
            console.error("room browser failed:", error);

            const roomList =
                document.getElementById("roomList");

            document.getElementById(
                "roomCount"
            ).textContent = "error";

            roomList.innerHTML = "";

            setError(
                "browseError",
                "couldn't load rooms: " + describeFirebaseError(error)
            );
        }
    );
}


function stopRoomBrowser() {

    if (browserListener) {

        browserListener();

        browserListener = null;
    }
}


/* ============================== */
/* CREATE ROOM                    */
/* ============================== */

document.getElementById(
    "createRoomButton"
).onclick = async () => {

    clearErrors();

    if (!currentUser) {

        setError(
            "createError",
            "still connecting to the server - wait a second and try again."
        );

        return;
    }

    const roomName =
        cleanRoomName(
            document.getElementById(
                "createRoomName"
            ).value
        );

    const name =
        cleanName(
            document.getElementById(
                "createName"
            ).value
        );

    const maxPlayers =
        Number(
            document.getElementById(
                "maxPlayers"
            ).value
        );

    const isPrivate =
        document.getElementById(
            "privateRoom"
        ).checked;

    if (!validRoomName(roomName)) {

        setError(
            "createError",
            "enter a valid room name."
        );

        return;
    }

    if (!validName(name)) {

        setError(
            "createError",
            "enter a valid account name."
        );

        return;
    }

    if (maxPlayers < 2 || maxPlayers > 50) {

        setError(
            "createError",
            "maximum players must be between 2 and 50."
        );

        return;
    }

    const button =
        document.getElementById(
            "createRoomButton"
        );

    button.disabled = true;
    button.textContent = "creating...";

    try {

        let roomCode = null;

        for (let i = 0; i < 10; i++) {

            const generated =
                generateRoomCode();

            const roomRef =
                ref(
                    db,
                    "rooms/" + generated
                );

            const snapshot =
                await get(roomRef);

            if (!snapshot.exists()) {

                roomCode = generated;

                break;
            }
        }

        if (!roomCode) {

            setError(
                "createError",
                "couldn't generate a room code."
            );

            return;
        }

        const roomRef =
            ref(
                db,
                "rooms/" + roomCode
            );

        await set(
            roomRef,
            {
                name: roomName,
                host: currentUser.uid,
                maxPlayers: maxPlayers,
                private: isPrivate,
                createdAt: serverTimestamp()
            }
        );

        const claimed =
            await claimName(
                roomCode,
                name
            );

        if (!claimed) {

            await remove(roomRef);

            setError(
                "createError",
                "couldn't create the room."
            );

            return;
        }

        currentName = name;
        currentRoomName = roomName;
        currentRoom = roomCode;
        isHost = true;

        await setupDisconnect();

        enterRoom(
            roomCode,
            name,
            roomName,
            true
        );

    } catch (error) {

        console.error("create room failed:", error);

        setError(
            "createError",
            "couldn't create the room: " + describeFirebaseError(error)
        );

    } finally {

        button.disabled = false;
        button.textContent = "create";
    }
};


/* ============================== */
/* CLAIM NAME                     */
/* ============================== */

async function claimName(
    roomCode,
    name
) {

    const normalized =
        normalizeName(name);

    if (!normalized) {
        return false;
    }

    const nameRef =
        ref(
            db,
            "rooms/" +
            roomCode +
            "/names/" +
            normalized
        );

    const result =
        await runTransaction(
            nameRef,
            existing => {

                if (existing === null) {
                    return currentUser.uid;
                }

                if (
                    existing ===
                    currentUser.uid
                ) {
                    return existing;
                }

                return;
            }
        );

    if (!result.committed) {
        return false;
    }

    const playerRef =
        ref(
            db,
            "rooms/" +
            roomCode +
            "/players/" +
            currentUser.uid
        );

    await set(
        playerRef,
        {
            name: name,
            joinedAt: serverTimestamp()
        }
    );

    await postSystemMessage(
        roomCode,
        name.toLowerCase() +
        " has joined"
    );

    return true;
}


/* ============================== */
/* SYSTEM MESSAGES                */
/* ============================== */

async function postSystemMessage(
    roomCode,
    text
) {

    try {

        const messagesRef =
            ref(
                db,
                "rooms/" +
                roomCode +
                "/messages"
            );

        await set(
            push(messagesRef),
            {
                system: true,
                text: text,
                timestamp: serverTimestamp()
            }
        );

    } catch (error) {

        console.error("system message failed:", error);
    }
}


/* ============================== */
/* JOIN ROOM                      */
/* ============================== */

document.getElementById(
    "joinCodeButton"
).onclick = async () => {

    clearErrors();

    const code =
        document
            .getElementById(
                "roomCodeInput"
            )
            .value
            .trim()
            .toUpperCase();

    const name =
        cleanName(
            document
                .getElementById(
                    "browseName"
                )
                .value
        );

    if (!code) {

        setError(
            "browseError",
            "enter a room code or choose a room below."
        );

        return;
    }

    if (!/^[A-Z0-9]{6}$/.test(code)) {

        setError(
            "browseError",
            "room codes are 6 characters."
        );

        return;
    }

    if (!validName(name)) {

        setError(
            "browseError",
            "enter a valid account name."
        );

        return;
    }

    await joinRoom(
        code,
        name
    );
};


async function joinRoom(
    roomCode,
    name
) {

    clearErrors();

    if (!currentUser) {

        setError(
            "browseError",
            "still connecting to the server - wait a second and try again."
        );

        return;
    }

    try {

        const roomRef =
            ref(
                db,
                "rooms/" + roomCode
            );

        const roomSnapshot =
            await get(roomRef);

        if (!roomSnapshot.exists()) {

            setError(
                "browseError",
                "that room doesn't exist."
            );

            return;
        }

        const room =
            roomSnapshot.val();

        const playersSnapshot =
            await get(
                ref(
                    db,
                    "rooms/" +
                    roomCode +
                    "/players"
                )
            );

        const playerCount =
            playersSnapshot.exists()
                ? Object.keys(
                    playersSnapshot.val()
                ).length
                : 0;

        if (
            playerCount >=
            room.maxPlayers
        ) {

            setError(
                "browseError",
                "that room is full."
            );

            return;
        }

        const claimed =
            await claimName(
                roomCode,
                name
            );

        if (!claimed) {

            setError(
                "browseError",
                "that account name is already being used in this room."
            );

            return;
        }

        currentRoom = roomCode;
        currentName = name;
        currentRoomName =
            room.name || "room";
        isHost = false;

        await setupDisconnect();

        stopRoomBrowser();

        enterRoom(
            roomCode,
            name,
            currentRoomName,
            false
        );

    } catch (error) {

        console.error("join room failed:", error);

        setError(
            "browseError",
            "couldn't join the room: " + describeFirebaseError(error)
        );
    }
}


/* ============================== */
/* DISCONNECT                     */
/* ============================== */

async function setupDisconnect() {

    if (
        !currentRoom ||
        !currentUser ||
        !currentName
    ) {
        return;
    }

    const playerRef =
        ref(
            db,
            "rooms/" +
            currentRoom +
            "/players/" +
            currentUser.uid
        );

    const normalized =
        normalizeName(currentName);

    const nameRef =
        ref(
            db,
            "rooms/" +
            currentRoom +
            "/names/" +
            normalized
        );

    disconnectPlayerRef =
        onDisconnect(
            playerRef
        );

    disconnectNameRef =
        onDisconnect(
            nameRef
        );

    await disconnectPlayerRef.remove();
    await disconnectNameRef.remove();
}


/* ============================== */
/* ENTER ROOM                     */
/* ============================== */

function enterRoom(
    roomCode,
    name,
    roomName,
    host
) {

    currentRoom = roomCode;
    currentName = name;
    currentRoomName = roomName;
    isHost = host;

    document.getElementById(
        "displayRoomName"
    ).textContent =
        roomName;

    document.getElementById(
        "displayRoomCode"
    ).textContent =
        roomCode;

    document.getElementById(
        "chat"
    ).innerHTML = `
        <div class="noMessages">
            no messages yet
        </div>
    `;

    showScreen("roomScreen");

    listenToRoom();
    listenToPlayers();
    listenToMessages();
}


/* ============================== */
/* ROOM LISTENER                  */
/* ============================== */

function listenToRoom() {

    if (roomListener) {
        roomListener();
    }

    const roomRef =
        ref(
            db,
            "rooms/" +
            currentRoom
        );

    roomListener =
        onValue(
            roomRef,
            snapshot => {

                if (!snapshot.exists()) {

                    leaveRoom(
                        false
                    );

                    return;
                }

                const room =
                    snapshot.val();

                const players =
                    countPlayers(
                        room.players
                    );

                document.getElementById(
                    "playerCount"
                ).textContent =
                    `${players} / ${room.maxPlayers}`;

                document.getElementById(
                    "roomStatus"
                ).textContent =
                    room.private
                        ? "private"
                        : "";
            },
            error => {

                console.error("room listener failed:", error);

                setError(
                    "roomError",
                    "lost connection to this room: " + describeFirebaseError(error)
                );
            }
        );
}


/* ============================== */
/* PLAYER LIST                    */
/* ============================== */

function listenToPlayers() {

    if (playersListener) {
        playersListener();
    }

    const playersRef =
        ref(
            db,
            "rooms/" +
            currentRoom +
            "/players"
        );

    playersListener =
        onValue(
            playersRef,
            snapshot => {

                const playersElement =
                    document.getElementById(
                        "players"
                    );

                playersElement.innerHTML = "";

                if (!snapshot.exists()) {
                    return;
                }

                const players =
                    snapshot.val();

                Object.entries(
                    players
                ).forEach(
                    ([uid, player]) => {

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "player";

                        if (
                            uid ===
                            currentUser.uid
                        ) {
                            div.classList.add(
                                "host"
                            );
                        }

                        const name =
                            document.createElement(
                                "span"
                            );

                        name.textContent =
                            player.name;

                        div.appendChild(
                            name
                        );

                        if (
                            uid ===
                            currentUser.uid
                        ) {

                            const you =
                                document.createElement(
                                    "span"
                                );

                            you.className =
                                "playerYou";

                            you.textContent =
                                "(you)";

                            div.appendChild(
                                you
                            );
                        }

                        playersElement
                            .appendChild(
                                div
                            );
                    }
                );
            },
            error => {

                console.error("players listener failed:", error);

                setError(
                    "roomError",
                    "couldn't load players: " + describeFirebaseError(error)
                );
            }
        );
}


/* ============================== */
/* CHAT                           */
/* ============================== */

function listenToMessages() {

    if (messagesListener) {
        messagesListener();
    }

    const messagesRef =
        ref(
            db,
            "rooms/" +
            currentRoom +
            "/messages"
        );

    messagesListener =
        onValue(
            messagesRef,
            snapshot => {

                const chat =
                    document.getElementById(
                        "chat"
                    );

                chat.innerHTML = "";

                if (!snapshot.exists()) {

                    chat.innerHTML = `
                        <div class="noMessages">
                            no messages yet
                        </div>
                    `;

                    return;
                }

                const messages =
                    Object.values(
                        snapshot.val()
                    );

                messages.sort(
                    (a, b) =>
                        (a.timestamp || 0) -
                        (b.timestamp || 0)
                );

                messages.forEach(
                    message => {

                        const wrapper =
                            document.createElement(
                                "div"
                            );

                        if (message.system) {

                            wrapper.className =
                                "message systemMessage";

                            wrapper.textContent =
                                message.text;

                            chat.appendChild(
                                wrapper
                            );

                            return;
                        }

                        wrapper.className =
                            "message";

                        const messageName =
                            document.createElement(
                                "span"
                            );

                        messageName.className =
                            "messageName";

                        messageName.style.color =
                            /^#[0-9a-fA-F]{6}$/.test(message.color || "")
                                ? message.color
                                : "#eee";

                        messageName.textContent =
                            message.name + ":";

                        const messageText =
                            document.createElement(
                                "span"
                            );

                        messageText.textContent =
                            " " +
                            message.text;

                        wrapper.appendChild(
                            messageName
                        );

                        wrapper.appendChild(
                            messageText
                        );

                        chat.appendChild(
                            wrapper
                        );
                    }
                );

                chat.scrollTop =
                    chat.scrollHeight;
            },
            error => {

                console.error("messages listener failed:", error);

                setError(
                    "roomError",
                    "couldn't load chat: " + describeFirebaseError(error)
                );
            }
        );
}


/* ============================== */
/* SEND MESSAGE                   */
/* ============================== */

async function sendMessage() {

    if (
        !currentRoom ||
        !currentUser
    ) {
        return;
    }

    let message =
        document
            .getElementById(
                "chatInput"
            )
            .value
            .trim();

    if (!message) {
        return;
    }

    message =
        message.slice(
            0,
            300
        );

    message =
        censorMessage(
            message
        );

    try {

        const messagesRef =
            ref(
                db,
                "rooms/" +
                currentRoom +
                "/messages"
            );

        const messageRef =
            push(messagesRef);

        await set(
            messageRef,
            {
                uid: currentUser.uid,
                name: currentName,
                text: message,
                color: currentColor,
                timestamp: serverTimestamp()
            }
        );

        document.getElementById(
            "chatInput"
        ).value = "";

    } catch (error) {

        console.error("send message failed:", error);

        setError(
            "roomError",
            "couldn't send message: " + describeFirebaseError(error)
        );
    }
}


document.getElementById(
    "sendButton"
).onclick =
    sendMessage;


document.getElementById(
    "chatInput"
).addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {
            sendMessage();
        }
    }
);


/* ============================== */
/* SETTINGS                       */
/* ============================== */

const settingsModal =
    document.getElementById(
        "settingsModal"
    );

const chatColorInput =
    document.getElementById(
        "chatColorInput"
    );

const colorPreview =
    document.getElementById(
        "colorPreview"
    );

function updateColorPreview() {

    colorPreview.style.color =
        chatColorInput.value;
}

document.getElementById(
    "settingsButton"
).onclick = () => {

    chatColorInput.value =
        currentColor;

    updateColorPreview();

    settingsModal.classList.remove(
        "hidden"
    );
};

chatColorInput.addEventListener(
    "input",
    updateColorPreview
);

document.getElementById(
    "closeSettings"
).onclick = () => {

    currentColor =
        chatColorInput.value;

    localStorage.setItem(
        "chatColor",
        currentColor
    );

    settingsModal.classList.add(
        "hidden"
    );
};

settingsModal.addEventListener(
    "click",
    event => {

        if (event.target === settingsModal) {

            currentColor =
                chatColorInput.value;

            localStorage.setItem(
                "chatColor",
                currentColor
            );

            settingsModal.classList.add(
                "hidden"
            );
        }
    }
);


/* ============================== */
/* LEAVE ROOM                     */
/* ============================== */

document.getElementById(
    "leaveButton"
).onclick =
    () => {

        leaveRoom(
            true
        );
    };


async function leaveRoom(
    shouldCleanupRoom
) {

    if (
        !currentRoom ||
        !currentUser
    ) {
        showScreen(
            "homeScreen"
        );

        return;
    }

    const roomCode =
        currentRoom;

    const leavingName =
        currentName;

    const normalized =
        normalizeName(
            currentName
        );

    if (roomListener) {

        roomListener();
        roomListener = null;
    }

    if (playersListener) {

        playersListener();
        playersListener = null;
    }

    if (messagesListener) {

        messagesListener();
        messagesListener = null;
    }

    if (shouldCleanupRoom) {

        try {

            if (disconnectPlayerRef) {

                await disconnectPlayerRef.cancel();

                disconnectPlayerRef = null;
            }

            if (disconnectNameRef) {

                await disconnectNameRef.cancel();

                disconnectNameRef = null;
            }

            await remove(
                ref(
                    db,
                    "rooms/" +
                    roomCode +
                    "/players/" +
                    currentUser.uid
                )
            );

            await remove(
                ref(
                    db,
                    "rooms/" +
                    roomCode +
                    "/names/" +
                    normalized
                )
            );

            const playersSnapshot =
                await get(
                    ref(
                        db,
                        "rooms/" +
                        roomCode +
                        "/players"
                    )
                );

            const stillHasPlayers =
                playersSnapshot.exists() &&
                Object.keys(
                    playersSnapshot.val()
                ).length > 0;

            if (!stillHasPlayers) {

                await remove(
                    ref(
                        db,
                        "rooms/" +
                        roomCode
                    )
                );

            } else {

                await postSystemMessage(
                    roomCode,
                    leavingName.toLowerCase() +
                    " has left"
                );
            }

        } catch (error) {

            console.error("leave room cleanup failed:", error);
        }
    }

    currentRoom = null;
    currentName = null;
    currentRoomName = null;
    isHost = false;

    document.getElementById(
        "chat"
    ).innerHTML = "";

    document.getElementById(
        "players"
    ).innerHTML = "";

    showScreen(
        "homeScreen"
    );
}


/* ============================== */
/* INITIAL                        */
/* ============================== */

showScreen(
    "homeScreen"
);

</script>
